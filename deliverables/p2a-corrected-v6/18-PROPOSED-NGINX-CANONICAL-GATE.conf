# Root-owned nginx configuration. Deployment renders the exact admitted release
# marker into this include before upstream switch and reloads nginx atomically.
map $request_uri $aifrogi_canonical_route {
  default 0;
  ~^/api/public/website-bot/ 1;
  ~^/api/public/hotelgpt/ 1;
  ~^/api/automation/run 1;
}
map "$aifrogi_canonical_route:$aifrogi_release_admitted" $aifrogi_gate_denied {
  default 0;
  "1:0" 1;
}
geo $aifrogi_canary_allowed {
  default 0;
  include /etc/nginx/conf.d/aifrogi-canary-allow-cidrs.conf;
}
map "$aifrogi_canonical_route:$aifrogi_canary_required:$aifrogi_canary_allowed" $aifrogi_canary_denied {
  default 0;
  "1:1:0" 1;
}
map "$aifrogi_gate_denied:$aifrogi_canary_denied" $aifrogi_factual_denied {
  default 0;
  "1:0" 1;
  "0:1" 1;
  "1:1" 1;
}

# Active directives in the server block, before proxy_pass:
include /etc/nginx/conf.d/aifrogi-release-admission.conf;
include /etc/nginx/conf.d/aifrogi-canary-mode.conf;
if ($aifrogi_factual_denied) { return 503; }
# Part 17 renders the include only after signature, archive-hash and contract
# verification, then validates and reloads nginx.
