name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:dependency-security
